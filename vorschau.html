<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vorschau Desktop und Handy · Nordheide Stories</title>
<style>
body{margin:0;background:#2a2428;color:#F2EDE5;font-family:Georgia,serif}
header{padding:18px 24px;display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
header b{font-weight:400;font-size:18px}
header a{color:#c9b7c5;font-size:14px}
.stage{display:flex;gap:32px;padding:0 24px 32px;align-items:flex-start;overflow-x:auto}
.dev span{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:8px}
.desk{width:768px;height:480px;overflow:hidden;border:1px solid #444;border-radius:6px;background:#fff}
.desk iframe{width:1280px;height:800px;border:0;transform:scale(.6);transform-origin:0 0}
.phone{width:390px;height:760px;border:10px solid #111;border-radius:36px;overflow:hidden;background:#fff}
.phone iframe{width:390px;height:740px;border:0}
</style></head><body>
<header><b>Nordheide Stories · Vorschau</b>
<a href="#" data-p="index.html">Startseite</a><a href="#" data-p="geschichten.html">Geschichten</a><a href="#" data-p="aus-liebe.html">Aus Liebe.</a></header>
<div class="stage">
 <div class="dev"><span>Desktop · 1280 × 800 (verkleinert)</span><div class="desk"><iframe id="d" src="index.html" title="Desktop"></iframe></div></div>
 <div class="dev"><span>Handy · 390 px</span><div class="phone"><iframe id="m" src="index.html" title="Handy"></iframe></div></div>
</div>
<script>
document.querySelectorAll('[data-p]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();document.getElementById('d').src=a.dataset.p;document.getElementById('m').src=a.dataset.p;})});
</script>
</body></html>
